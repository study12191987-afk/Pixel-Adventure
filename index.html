<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7ba05b">
  <link rel="apple-touch-icon" href="pixel-adventure-icon-192.png">
  
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Pixel Adventure V7.1 - Full Pixel UI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game-container">

    <div class="pixel-badge">THE GUARDIAN</div>

    <h1>PIXEL ADVENTURE</h1>

    <div class="level-title" id="levelTitle">
      LEVEL 1
    </div>

    <div class="game-info">

      <span id="lifeDisplay">
        ❤️ 生命：3
      </span>

      <span id="coinDisplay">
        🪙 金币：0/3
      </span>

    </div>


    <!-- 游戏画面 -->

    <div class="canvas-wrapper">

      <canvas
        id="gameCanvas"
        width="320"
        height="320"
      ></canvas>


      <!-- 游戏弹窗 -->

      <div
        class="game-modal hidden"
        id="gameModal"
      >

        <div class="modal-box">

          <div
            class="modal-icon"
            id="modalIcon"
          >
            🎉
          </div>

          <h2 id="modalTitle">
            LEVEL COMPLETE!
          </h2>

          <p id="modalText">
            准备进入下一关
          </p>

          <button id="modalButton">
            CONTINUE
          </button>

        </div>

      </div>

    </div>


    <!-- 控制按钮 -->

    <div class="controls">

      <button id="up">▲</button>

      <div class="middle-controls">

        <button id="left">◀</button>

        <button id="down">▼</button>

        <button id="right">▶</button>

      </div>

    </div>


    <div class="keyboard-tip">
      <span class="tip-label">KEYBOARD</span>
      WASD / ↑ ↓ ← →
    </div>

  </div>


  <script src="levels.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>


<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .then(() => {
          console.log("Pixel Adventure Service Worker ready!");
        })
        .catch(error => {
          console.error("Service Worker failed:", error);
        });
    });
  }
</script>
</body>

</html>
